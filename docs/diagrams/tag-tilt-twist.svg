<svg xmlns="http://www.w3.org/2000/svg" width="640" height="775" viewBox="0 0 640 775" role="img" aria-labelledby="title desc">
  <title id="title">Gravity-relative tag Tilt and Twist</title>
  <desc id="desc">The top panel views a tag from the side: a vertical plane is zero degrees tilt, a leaning plane is between zero and ninety, and a horizontal plane is ninety. The bottom panel views the printed front: rotating the printed square clockwise from gravity-defined upright produces positive twist. A horizontal tag has undefined twist.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#2563b8"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#465873"/></marker></defs>
  <rect width="640" height="775" rx="18" fill="#f4f7fb"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#182638">
    <text x="28" y="40" font-size="25" font-weight="700">Tilt: lean from vertical</text>
    <text x="28" y="71" font-size="19" fill="#465873">Side view of the printed plane</text>
    <path d="M52 239H590" stroke="#b5c2d4" stroke-width="2"/>
    <path d="M111 239V115" stroke="#19734b" stroke-width="9"/>
    <path d="M304 239V109" stroke="#b5c2d4" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M304 239L369 126" stroke="#2563b8" stroke-width="9"/>
    <path d="M304 176A63 63 0 0 1 336 184" fill="none" stroke="#2563b8" stroke-width="3"/>
    <text x="317" y="160" font-size="20" fill="#2563b8">30°</text>
    <path d="M468 239H587" stroke="#ad6920" stroke-width="9"/>
    <text x="76" y="275" font-size="23" font-weight="600">0°</text>
    <text x="61" y="304" font-size="20">Vertical</text>
    <text x="290" y="275" font-size="23" font-weight="600">30°</text>
    <text x="274" y="304" font-size="20">Leaning</text>
    <text x="507" y="275" font-size="23" font-weight="600">90°</text>
    <text x="476" y="304" font-size="20">Horizontal</text>
    <path d="M28 335H612" stroke="#d3dce8" stroke-width="2"/>
    <text x="28" y="379" font-size="25" font-weight="700">Twist: turn within the plane</text>
    <text x="28" y="410" font-size="19" fill="#465873">View from the printed front of a vertical tag</text>
    <g transform="translate(164 555)">
      <rect x="-69" y="-69" width="138" height="138" rx="3" fill="#fff" stroke="#182638" stroke-width="7"/>
      <path d="M0 41V-42" stroke="#2563b8" stroke-width="5" marker-end="url(#arrow)"/>
      <rect x="-53" y="-53" width="18" height="18" fill="#182638"/>
      <text x="0" y="112" text-anchor="middle" font-size="23" font-weight="600">Twist 0°</text>
    </g>
    <path d="M332 619V456" stroke="#465873" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#gray)"/>
    <text x="291" y="440" font-size="19">World up</text>
    <g transform="translate(468 555)">
      <g transform="rotate(30)">
        <rect x="-69" y="-69" width="138" height="138" rx="3" fill="#fff" stroke="#182638" stroke-width="7"/>
        <path d="M0 41V-42" stroke="#2563b8" stroke-width="5" marker-end="url(#arrow)"/>
        <rect x="-53" y="-53" width="18" height="18" fill="#182638"/>
      </g>
      <path d="M-27-101A104 104 0 0 1 69-78" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="0" y="112" text-anchor="middle" font-size="23" font-weight="600">Twist +30°</text>
    </g>
    <text x="28" y="714" font-size="20" fill="#465873">Positive twist is clockwise; negative is counterclockwise.</text>
    <text x="28" y="746" font-size="20" fill="#465873">Horizontal plane: Tilt 90°, Twist — (no upright).</text>
  </g>
</svg>
